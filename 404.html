<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Sayfa Bulunamadı | ELIYTE</title>
    <meta name="description" content="Aradığınız sayfa bulunamadı. ELIYTE ana sayfasına dönün.">
    <link rel="icon" type="image/svg+xml" href="images/logo-1x1-dark.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }
        .error-content {
            max-width: 600px;
        }
        .error-code {
            font-family: 'Orbitron', sans-serif;
            font-size: 8rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 1rem;
        }
        .error-title {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--title-color);
        }
        .error-description {
            font-size: 1.1rem;
            color: var(--text-color);
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .error-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .error-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(101, 31, 255, 0.3);
        }
        .error-button-secondary {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .error-icon {
            font-size: 5rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        @media (max-width: 768px) {
            .error-code {
                font-size: 5rem;
            }
            .error-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-content">
            <div class="error-icon">
                <i class="fas fa-robot"></i>
            </div>
            <h1 class="error-code">404</h1>
            <h2 class="error-title" data-i18n="error.title">Sayfa Bulunamadı</h2>
            <p class="error-description" data-i18n="error.description">
                Aradığınız sayfa taşınmış, silinmiş veya hiç var olmamış olabilir.
                Ana sayfaya dönün veya arama yapın.
            </p>
            <div class="error-actions">
                <a href="index.html" class="error-button">
                    <i class="fas fa-home"></i>
                    <span data-i18n="error.home">Ana Sayfaya Dön</span>
                </a>
                <a href="index.html#contact" class="error-button error-button-secondary">
                    <i class="fas fa-envelope"></i>
                    <span data-i18n="error.contact">İletişime Geçin</span>
                </a>
            </div>
        </div>
    </div>

    <script src="js/language.js"></script>
</body>
</html>
